<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瓷器典藏 GALLERY</title>
    <style>
        :root {
            --bg-color: #f7f6f2;
            --text-primary: #2c2c2c;
            --text-secondary: #666666;
            --accent-color: #8c7b6b;
            --card-shadow: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang SC", "Noto Serif SC", "Songti SC", serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 导航栏：解决遮挡问题 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none; /* 防止遮挡右侧可点击按钮 */
        }

        .logo, .nav-links {
            pointer-events: auto; /* 保证 Logo 和菜单文字本身可点击 */
        }

        .logo {
            font-size: 1.2rem;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* 首页 3D 堆叠视图 */
        .gallery-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .stack-wrapper {
            position: relative;
            width: 320px;
            height: 460px;
            transform-style: preserve-3d;
            transform: rotateX(15deg) rotateY(-15deg) rotateZ(5deg);
            transition: transform 0.5s ease-out;
        }

        .stack-wrapper:hover {
            transform: rotateX(10deg) rotateY(-8deg) rotateZ(2deg) scale(1.02);
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 20px 40px var(--card-shadow);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            background: #fff;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card:nth-child(1) { transform: translateZ(0px); }
        .card:nth-child(2) { transform: translateZ(-40px) translateY(-15px) translateX(15px); }
        .card:nth-child(3) { transform: translateZ(-80px) translateY(-30px) translateX(30px); }
        .card:nth-child(4) { transform: translateZ(-120px) translateY(-45px) translateX(45px); }
        .card:nth-child(5) { transform: translateZ(-160px) translateY(-60px) translateX(60px); }

        /* 详情页视图 */
        .detail-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            z-index: 50;
            background-color: var(--bg-color);
        }

        .detail-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        .detail-left {
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px;
        }

        .detail-left img {
            max-width: 85%;
            max-height: 80vh;
            object-fit: contain;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            background: #fff;
            padding: 10px;
        }

        .detail-right {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 100px 80px 40px;
            overflow-y: auto;
        }

        .item-number {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .item-title {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 24px;
            line-height: 1.3;
        }

        .item-meta {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.8;
            border-left: 2px solid var(--accent-color);
            padding-left: 12px;
        }

        .item-desc {
            font-size: 0.95rem;
            line-height: 2;
            color: #4a4a4a;
            white-space: pre-line;
            text-align: justify;
        }

        .controls {
            position: fixed;
            bottom: 40px;
            right: 100px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 120;
        }

        .btn {
            background: none;
            border: 1px solid #ccc;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .btn:hover {
            border-color: var(--text-primary);
            background: #fff;
        }

        /* 返回按钮层级提升到最高 */
        .back-btn {
            position: fixed;
            top: 35px;
            right: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 1px;
            z-index: 120;
            display: none;
            pointer-events: auto;
        }

        footer {
            position: fixed;
            bottom: 30px;
            left: 50px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">瓷器典藏 GALLERY</div>
        <ul class="nav-links">
            <li>典藏目录</li>
            <li>关于展览</li>
        </ul>
    </header>

    <div class="back-btn" id="backBtn">← 返回堆叠预览</div>

    <div class="gallery-container" id="galleryContainer">
        <div class="stack-wrapper" id="stackWrapper">
            <div class="card" onclick="openDetail(0)"><img src="679b5b218ee8f1e72bdbc8a7cd236650.jpg" alt="藏品1"></div>
            <div class="card" onclick="openDetail(1)"><img src="db1b007985cb9e5cc47291e78d0eba4e.jpg" alt="藏品2"></div>
            <div class="card" onclick="openDetail(2)"><img src="7f2b031b0955ec89d3a5dd726402bb2a.jpg" alt="藏品3"></div>
            <div class="card" onclick="openDetail(3)"><img src="97d5ecdab7ae43bfd52348d1f8fcb3b0.jpg" alt="藏品4"></div>
            <div class="card" onclick="openDetail(4)"><img src="c385420d5c872f184a3b72c9e44b9b84.jpg" alt="藏品5"></div>
        </div>
    </div>

    <div class="detail-view" id="detailView">
        <div class="detail-left">
            <img id="detailImg" src="" alt="藏品大图">
        </div>
        <div class="detail-right">
            <div class="item-number" id="itemNumber">COLLECTION / 01</div>
            <h1 class="item-title" id="itemTitle">藏品名称</h1>
            <div class="item-meta" id="itemMeta"></div>
            <p class="item-desc" id="itemDesc"></p>
        </div>
    </div>

    <div class="controls" id="controls" style="display: none;">
        <button class="btn" onclick="prevItem()">←</button>
        <span id="pageIndicator" style="font-size: 0.9rem;">01 / 10</span>
        <button class="btn" onclick="nextItem()">→</button>
    </div>

    <footer>
        © 瓷器典藏珍萃 | 分层堆叠作品集
    </footer>

    <script>
        const items = [
            {
                title: "南宋官窑花口瓶",
                number: "藏品 01",
                img: "679b5b218ee8f1e72bdbc8a7cd236650.jpg",
                meta: "尺寸：15.6 公分<br>来源：苏富比",
                desc: "此瓶作花式棱口，含蓄朴雅，胎土褐中带紫，罩施青釉，片纹如冰开裂，合符赵宋皇室品味。器形虽简，但烧造过程必须一丝不苟，才可成就美器如斯。"
            },
            {
                title: "宋·官窑青釉暗龙纹洗",
                number: "藏品 02",
                img: "db1b007985cb9e5cc47291e78d0eba4e.jpg",
                meta: "摄于：天津博物馆",
                desc: "官窑为宋代五大名窑之一，此洗属南宋郊坛官窑产品。洗壁垂直微向外撇，平底，圈足宽而浅。通体灰青色釉，青翠如玉，釉质肥厚凝重，釉面布满了自然天成、纵横交错的开片。洗口部镶铜口，圈足露胎呈褐色，紫口铁足的特征十分明显。洗内底印有一条苍龙，其形象矫健勇猛，笔触细微，但由于施釉太厚，只有高光下才能显现，更增添了“神龙见首不见尾”的神秘之感。此洗釉色纯正，造型古朴大方，为宋代官窑典型器物。"
            },
            {
                title: "南宋 官窑米黄釉直颈瓶",
                number: "藏品 03",
                img: "7f2b031b0955ec89d3a5dd726402bb2a.jpg",
                meta: "尺寸：22.3 cm<br>来源：香港苏富比2025秋拍《伊势彦信珍藏重要中国陶瓷》",
                desc: "此件官窑瓶釉面厚润如脂，开片纹络如幻，实为罕见珍贵的「米色官窑」典范。远观含蓄内敛，近赏则生机勃发，指尖抚过其柔美曲线，细察釉面微妙变化，方能领略其深邃底蕴。\n釉色呈现米黄的淡琥珀色调，冰裂开片精妙绝伦，此般美好，源自近千年前龙窑烧造时的偶然天成。杭州官窑通常采用还原焰烧製，釉中铁元素在缺氧环境下呈现青蓝色调；而本品却因窑内意外渗入氧气，形成氧化铁特有的橙黄色泽。无论刻意为之或窑变偶得，此类未充分还原的官窑器存世极罕。"
            },
            {
                title: "南宋 官釉弦纹长颈瓶",
                number: "藏品 04",
                img: "97d5ecdab7ae43bfd52348d1f8fcb3b0.jpg",
                meta: "尺寸： H x W: 23.2 x 14.1 cm<br>来源：美国弗利尔",
                desc: "南宋官釉弦纹长颈瓶，造型端庄秀丽，通体施青釉，开片自然贯穿，线条舒展优美。"
            },
            {
                title: "宋 龙泉官青釉鬲式炉",
                number: "藏品 05",
                img: "c385420d5c872f184a3b72c9e44b9b84.jpg",
                meta: "尺寸：13.5 公分<br>来源：苏富比2020「凝盈一色」；艾弗瑞．克拉克伉俪收藏；伦敦苏富比1975年3月25日，编号58；Robert Barron 收藏；纽约佳士得2005年3月30日，编号321",
                desc: "鬲式炉造形雅秀，釉色莹润，乃龙泉青瓷登峰之作，尽显南宋美学菁粹。\n北宋末年，女真大金攻入国都汴京，今河南开封，宋室南迁，1135年定都临安，今浙江杭州。是时文艺发展甚为蓬勃，为供应南宋朝廷所需用器，南方製瓷工艺突飞猛进，前所未见，龙泉窰即为其中显例。龙泉窑位于龙泉县，以大窑为中心，烧造之器多为文绅、显贵及朝廷所用，质精雅致，尤以胎质、造形、做工为尚。"
            },
            {
                title: "明 官釉小胆瓶",
                number: "藏品 06",
                img: "a0b8746a0b0964ebdd6f9c4a83724641.jpg",
                meta: "类型：瓶类文房器具",
                desc: "瓶圆形侈口，细长颈渐丰，削肩垂腹，窄圈足，因器形如悬胆而得名胆瓶。胆瓶为各式瓶形中器形最为典雅优美而超凡脱俗的，可作花器。全器通体施，有细碎蟹爪纹开片。釉色泛青灰，呈现出乳浊的失透质感，隐隐露出釉层下灰黑胎体之色，若翠色浸入胎骨，令人心旷神怡。"
            },
            {
                title: "清乾隆 仿汝釉花觚",
                number: "藏品 07",
                img: "78a59062ee2637286fa48059ae622b81.jpg",
                meta: "款识：《大清乾隆年製》款<br>尺寸：27.2 公分<br>来源：苏富比",
                desc: "景德镇御窑瓷匠技臻艺绝，本品当为其中典范。此类花觚造型简洁，或带出戟装饰，亦有无出戟造型，釉种丰富，施仿官、天蓝或仿汝釉。单观外貌，单色釉瓷似为简单，实则技巧要求极高，于各门中唯属最难，需取纯土，施精工，罩匀釉，稳火入窰，佳器方成。"
            },
            {
                title: "明成化 青花九秋图罐",
                number: "藏品 08",
                img: "6cf756362fb806660a61fab6f3ff25f5.jpg",
                meta: "尺寸：h. 10.5 cm<br>来源：苏富比2026春拍《盛世奇葩：颂德堂珍藏明朝瓷器》",
                desc: "明成化年间（1464–1487年）在中国御窑瓷器史上佔据著独特且近乎矛盾的地位。该时期御窑烧造活动不足二十年，既未产生宏大的器型，也未引发华丽的风格革命，然而其瓷器却以极致精雅与内在权威，超越了后世更漫长、更高产的朝代所获成就，成为史上至为稀有、令人梦寐以求的珍品。"
            },
            {
                title: "明初 官钧玫瑰紫釉盘",
                number: "藏品 09",
                img: "b63e846d9d8aba525a36b3d46a086b91.jpg",
                meta: "尺寸：16.1 cm<br>来源：苏富比2026春拍《中国古代瑞兽艺术 | 中国艺术珍品》",
                desc: "本盘口沿微撇，弧壁，下接圈足，足底削修平整，胎质坚实厚重。通体施玫瑰紫釉，釉色浓丽幽润，口沿釉层垂流渐薄，呈酱黄色。造型端庄朴雅，风格娴雅典丽，实为明初官钧之瑰宝。"
            },
            {
                title: "清雍正 御制仿紫檀玲珑开光座天蓝釉八方洗",
                number: "藏品 10",
                img: "f387a6ab5560bb6c4c50c409ed1c2443.jpg",
                meta: "款识：“大清雍正年制”篆书款<br>尺寸：高20.1cm<br>来源：中贸圣佳2025秋季三十周年庆典拍卖会《璀璨——古代艺术珍品夜场》",
                desc: "雍正一朝，御瓷创新众多，尤其唐英出任驻厂协理官之后，更是精彩迭出。天蓝色，化裁于宋之汝器，有“雨过天青”之说。本品的创新之处，则是器座的连体处理与摹仿紫檀木色的设计。此器座是为清代宫廷器座重要制式之一，窑火幻化之后瓷木难分，是为佳妙！"
            }
        ];

        let currentIndex = 0;

        function updateDetailView(index) {
            const data = items[index];
            document.getElementById('detailImg').src = data.img;
            document.getElementById('itemNumber').innerText = `COLLECTION / ${String(index + 1).padStart(2, '0')}`;
            document.getElementById('itemTitle').innerText = data.title;
            document.getElementById('itemMeta').innerHTML = data.meta;
            document.getElementById('itemDesc').innerText = data.desc;
            document.getElementById('pageIndicator').innerText = `${String(index + 1).padStart(2, '0')} / ${String(items.length).padStart(2, '0')}`;
        }

        function openDetail(index) {
            currentIndex = index;
            updateDetailView(currentIndex);
            document.getElementById('galleryContainer').style.opacity = '0';
            document.getElementById('galleryContainer').style.pointerEvents = 'none';
            document.getElementById('detailView').classList.add('active');
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';

            // 写入历史记录，防止浏览器后退导致报错退出
            history.pushState({ view: 'detail' }, '', '');
        }

        function closeDetail() {
            document.getElementById('detailView').classList.remove('active');
            document.getElementById('galleryContainer').style.opacity = '1';
            document.getElementById('galleryContainer').style.pointerEvents = 'auto';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
        }

        function nextItem() {
            currentIndex = (currentIndex + 1) % items.length;
            updateDetailView(currentIndex);
        }

        function prevItem() {
            currentIndex = (currentIndex - 1 + items.length) % items.length;
            updateDetailView(currentIndex);
        }

        document.getElementById('backBtn').addEventListener('click', closeDetail);

        // 监听浏览器后退事件，实现平滑返回首页
        window.addEventListener('popstate', function(event) {
            closeDetail();
        });
    </script>
</body>
</html>
